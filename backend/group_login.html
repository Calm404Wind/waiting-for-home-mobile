<!doctype html>
<html lang="zh-HK">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小組測試登入｜等一個家</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #fff4e5; color: #49372d; padding: 1.5rem; font: 1rem/1.5 system-ui, sans-serif }
  main { width: min(100%, 25rem); padding: clamp(1.5rem, 6vw, 2.5rem); border: 1px solid #e6d8cb; border-radius: 1.5rem; background: #fffcf7 }
  h1 { margin: 0; font: bold 2rem/1.3 Georgia, serif }
  p { margin: .65rem 0 1.5rem; color: #6d5548 }
  [role=alert] { color: #983f26 }
  label { display: block; margin-top: 1rem; font-weight: 650 }
  input, button { width: 100%; min-height: 3rem; border-radius: .75rem; font: inherit }
  input { margin-top: .35rem; padding: .55rem .8rem; color: inherit; background: white; border: 1px solid #9b8070 }
  :focus-visible { outline: 3px solid #326451; outline-offset: 2px }
  button { border: 0; margin-top: 1.5rem; padding: .65rem 1rem; font-weight: bold; color: white; background: #98441e; cursor: pointer }
</style>
<main>
  <h1>等一個家</h1>
  <p>使用小組帳戶和密鑰登入。此瀏覽器可保持登入七天。</p>
  <!--feedback-->
  <form action="/group/login" method="post">
    <input type="hidden" name="next" value="__NEXT__">
    <label for="username">小組帳戶</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="160">
    <label for="key">密鑰</label>
    <input id="key" name="key" type="password" autocomplete="current-password" required maxlength="256">
    <button type="submit">登入</button>
  </form>
</main>
<script nonce="__NONCE__">
  const destination = document.querySelector('input[name=next]');
  if (location.hash && !destination.value.includes('#')) destination.value += location.hash;
</script>
</html>
